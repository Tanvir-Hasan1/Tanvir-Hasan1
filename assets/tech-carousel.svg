<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 150" width="100%" height="150">
  <defs>
    <!-- Card Glare Gradient -->
    <linearGradient id="card-glare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Center Stage Spotlight -->
    <radialGradient id="stage-spotlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .card-item {
      animation-name: coverflow-6step;
      animation-duration: 18s;
      animation-iteration-count: infinite;
      animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-0 { animation-delay: 0s; }
    .card-1 { animation-delay: -3s; }
    .card-2 { animation-delay: -6s; }
    .card-3 { animation-delay: -9s; }
    .card-4 { animation-delay: -12s; }
    .card-5 { animation-delay: -15s; }

    svg:hover .card-item {
      animation-play-state: paused;
    }

    @keyframes coverflow-6step {
      /* POS 3: CENTER HERO FOCUS */
      0%, 12.78% {
        transform: translate(425px, 75px) scale(1.18);
        opacity: 1;
        filter: drop-shadow(0 12px 24px rgba(56, 189, 248, 0.4));
      }
      /* MOVE POS 3 -> POS 2 */
      16.67% {
        transform: translate(245px, 75px) scale(0.82);
        opacity: 0.65;
        filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.4));
      }
      /* POS 2: MID-LEFT */
      16.68%, 29.44% {
        transform: translate(245px, 75px) scale(0.82);
        opacity: 0.65;
        filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.4));
      }
      /* MOVE POS 2 -> POS 1 */
      33.33% {
        transform: translate(95px, 75px) scale(0.62);
        opacity: 0.25;
        filter: none;
      }
      /* POS 1: FAR-LEFT */
      33.34%, 46.11% {
        transform: translate(95px, 75px) scale(0.62);
        opacity: 0.25;
        filter: none;
      }
      /* HIDE AND TRANSIT POS 1 -> BEHIND */
      49% {
        transform: translate(95px, 75px) scale(0.4);
        opacity: 0;
      }
      50%, 62.78% {
        transform: translate(425px, 75px) scale(0.3);
        opacity: 0;
      }
      63% {
        transform: translate(755px, 75px) scale(0.4);
        opacity: 0;
      }
      /* POS 5: FAR-RIGHT */
      66.67%, 79.44% {
        transform: translate(755px, 75px) scale(0.62);
        opacity: 0.25;
        filter: none;
      }
      /* MOVE POS 5 -> POS 4 */
      83.33% {
        transform: translate(605px, 75px) scale(0.82);
        opacity: 0.65;
        filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.4));
      }
      /* POS 4: MID-RIGHT */
      83.34%, 96.11% {
        transform: translate(605px, 75px) scale(0.82);
        opacity: 0.65;
        filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.4));
      }
      /* MOVE POS 4 -> POS 3 */
      100% {
        transform: translate(425px, 75px) scale(1.18);
        opacity: 1;
        filter: drop-shadow(0 12px 24px rgba(56, 189, 248, 0.4));
      }
    }
  </style>

  <!-- Shell Container (Borderless, Seamless Background) -->
  <rect width="850" height="150" rx="14" fill="#0B0F19"/>

  <!-- Center Stage Glow (Emphasizes Middle Card) -->
  <ellipse cx="425" cy="75" rx="160" ry="70" fill="url(#stage-spotlight)"/>

  <!-- Six Step-and-Hold Cards (Borderless) -->

    <g class="card-item card-0">
      <!-- Card Container Box (Completely Borderless) -->
      <rect x="-56" y="-60" width="112" height="120" rx="16" fill="#131B2E"/>
      <rect x="-56" y="-60" width="112" height="120" rx="16" fill="url(#card-glare)" opacity="0.12"/>
      
      <!-- Icon Graphic -->
      
          <ellipse cx="0" cy="-14" rx="20" ry="7.5" fill="none" stroke="#61DAFB" stroke-width="2" transform="rotate(30 0 -14)"/>
          <ellipse cx="0" cy="-14" rx="20" ry="7.5" fill="none" stroke="#61DAFB" stroke-width="2" transform="rotate(90 0 -14)"/>
          <ellipse cx="0" cy="-14" rx="20" ry="7.5" fill="none" stroke="#61DAFB" stroke-width="2" transform="rotate(150 0 -14)"/>
          <circle cx="0" cy="-14" r="4" fill="#61DAFB"/>
        
      
      <!-- Tech Name -->
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">React Native</text>
      <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#61DAFB" text-anchor="middle">Mobile Core</text>
    </g>
    

    <g class="card-item card-1">
      <!-- Card Container Box (Completely Borderless) -->
      <rect x="-56" y="-60" width="112" height="120" rx="16" fill="#141824"/>
      <rect x="-56" y="-60" width="112" height="120" rx="16" fill="url(#card-glare)" opacity="0.12"/>
      
      <!-- Icon Graphic -->
      
          <circle cx="0" cy="-14" r="20" fill="#000000"/>
          <path d="M -9 2 L 0 -24 L 9 2 L 4 2 L 0 -10 L -4 2 Z" fill="#FFFFFF"/>
        
      
      <!-- Tech Name -->
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">Expo</text>
      <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#F8FAFC" text-anchor="middle">Mobile Framework</text>
    </g>
    

    <g class="card-item card-2">
      <!-- Card Container Box (Completely Borderless) -->
      <rect x="-56" y="-60" width="112" height="120" rx="16" fill="#141824"/>
      <rect x="-56" y="-60" width="112" height="120" rx="16" fill="url(#card-glare)" opacity="0.12"/>
      
      <!-- Icon Graphic -->
      
          <circle cx="0" cy="-14" r="20" fill="#000000"/>
          <path d="M -8 -25 L -8 0 M -8 -25 L 8 0 M 8 -25 L 8 -10" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
        
      
      <!-- Tech Name -->
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">Next.js 14</text>
      <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#E2E8F0" text-anchor="middle">Web Platform</text>
    </g>
    

    <g class="card-item card-3">
      <!-- Card Container Box (Completely Borderless) -->
      <rect x="-56" y="-60" width="112" height="120" rx="16" fill="#0F1E36"/>
      <rect x="-56" y="-60" width="112" height="120" rx="16" fill="url(#card-glare)" opacity="0.12"/>
      
      <!-- Icon Graphic -->
      
          <rect x="-20" y="-34" width="40" height="40" rx="8" fill="#3178C6"/>
          <text x="0" y="-8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">TS</text>
        
      
      <!-- Tech Name -->
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">TypeScript</text>
      <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#38BDF8" text-anchor="middle">Typed Systems</text>
    </g>
    

    <g class="card-item card-4">
      <!-- Card Container Box (Completely Borderless) -->
      <rect x="-56" y="-60" width="112" height="120" rx="16" fill="#0D1E16"/>
      <rect x="-56" y="-60" width="112" height="120" rx="16" fill="url(#card-glare)" opacity="0.12"/>
      
      <!-- Icon Graphic -->
      
          <polygon points="0,-33 18,-23 18,-3 0,7 -18,-3 -18,-23" fill="#0D1A12" stroke="#5FA04E" stroke-width="2.2" stroke-linejoin="round"/>
          <text x="0" y="-10" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="800" fill="#5FA04E" text-anchor="middle">NODE</text>
        
      
      <!-- Tech Name -->
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">Node.js</text>
      <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#34D399" text-anchor="middle">Backend Engine</text>
    </g>
    

    <g class="card-item card-5">
      <!-- Card Container Box (Completely Borderless) -->
      <rect x="-56" y="-60" width="112" height="120" rx="16" fill="#0A1C14"/>
      <rect x="-56" y="-60" width="112" height="120" rx="16" fill="url(#card-glare)" opacity="0.12"/>
      
      <!-- Icon Graphic -->
      
          <circle cx="0" cy="-14" r="20" fill="#0E2319"/>
          <path d="M 0 -30 C 0 -30 -10 -20 -10 -12 C -10 -5 -4 0 0 3 C 4 0 10 -5 10 -12 C 10 -20 0 -30 0 -30 Z" fill="#47A248"/>
          <path d="M 0 -30 L 0 3" stroke="#10B981" stroke-width="1.6"/>
        
      
      <!-- Tech Name -->
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">MongoDB</text>
      <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#47A248" text-anchor="middle">Data Storage</text>
    </g>
    
</svg>
