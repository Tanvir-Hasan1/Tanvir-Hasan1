<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="45%" stop-color="#0C1322"/>
      <stop offset="100%" stop-color="#0A0F1D"/>
    </linearGradient>

    <!-- Glowing Accents -->
    <radialGradient id="cyan-glow" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-glow" cx="85%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue-accent" cx="60%" cy="15%" r="40%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F1F5F9"/>
      <stop offset="80%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0"/>
      <stop offset="25%" stop-color="#06B6D4" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="1"/>
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="terminal-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.45"/>
      <circle cx="0" cy="0" r="1" fill="#38BDF8" fill-opacity="0.3"/>
    </pattern>
    
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    .pulse-dot { animation: pulse 2s infinite ease-in-out; }
    @keyframes pulse {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.92); }
    }
  </style>

  <!-- Container Box -->
  <rect width="850" height="320" rx="18" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="1.2"/>
  
  <!-- Cyber Grid -->
  <rect width="850" height="320" rx="18" fill="url(#cyber-grid)"/>

  <!-- Radial Glow Accents -->
  <rect width="850" height="320" rx="18" fill="url(#cyan-glow)"/>
  <rect width="850" height="320" rx="18" fill="url(#violet-glow)"/>
  <rect width="850" height="320" rx="18" fill="url(#blue-accent)"/>

  <!-- Corner Tech Brackets -->
  <path d="M 16 38 L 16 16 L 38 16" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 834 38 L 834 16 L 812 16" fill="none" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 16 282 L 16 304 L 38 304" fill="none" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 834 282 L 834 304 L 812 304" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Top Status Badge -->
  <g transform="translate(46, 38)">
    <rect width="270" height="26" rx="13" fill="#0E1726" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="13" r="4.5" fill="#10B981" filter="url(#neon-glow)"/>
    <circle cx="14" cy="13" r="2" fill="#FFFFFF"/>
    <text x="27" y="17" class="mono" font-size="10.5" font-weight="600" fill="#94A3B8" letter-spacing="0.8">SYSTEM STATUS : READY TO DEPLOY</text>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(46, 110)">
    <!-- Subtitle Category Tag -->
    <text x="0" y="0" class="mono" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="2.8">FULL-STACK &amp; EDGE AI ENGINEER</text>
    
    <!-- Main Full Name -->
    <text x="0" y="44" class="sans" font-size="44" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.8">Tanvir Hasan</text>
    
    <!-- Role & Specialization -->
    <text x="0" y="74" class="sans" font-size="15" font-weight="500" fill="#94A3B8">
      Engineering high-performance mobile architectures, on-device SLMs &amp; distributed web systems.
    </text>

    <!-- Mini Metric Pills -->
    <g transform="translate(0, 96)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="132" height="24" rx="6" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
      <text x="66" y="16" class="sans" font-size="10.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">UIU • CGPA 3.77</text>

      <!-- Pill 2 -->
      <rect x="140" y="0" width="144" height="24" rx="6" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
      <text x="212" y="16" class="sans" font-size="10.5" font-weight="600" fill="#38BDF8" text-anchor="middle">Local SLM &amp; LiteRT</text>

      <!-- Pill 3 -->
      <rect x="292" y="0" width="140" height="24" rx="6" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
      <text x="362" y="16" class="sans" font-size="10.5" font-weight="600" fill="#C084FC" text-anchor="middle">React Native &amp; Next</text>
    </g>
  </g>

  <!-- Right Terminal / Architecture Card -->
  <g transform="translate(480, 46)">
    <!-- Terminal Box -->
    <rect width="324" height="206" rx="12" fill="url(#terminal-bg)" stroke="url(#card-border)" stroke-width="1.2"/>
    
    <!-- Terminal Header Bar -->
    <rect width="324" height="32" rx="12" fill="#1E293B" fill-opacity="0.7"/>
    <path d="M 0 32 L 324 32" stroke="#334155" stroke-width="0.8"/>
    
    <!-- Window Control Dots -->
    <circle cx="18" cy="16" r="4.5" fill="#EF4444" fill-opacity="0.9"/>
    <circle cx="32" cy="16" r="4.5" fill="#F59E0B" fill-opacity="0.9"/>
    <circle cx="46" cy="16" r="4.5" fill="#10B981" fill-opacity="0.9"/>
    <text x="162" y="20" class="mono" font-size="10" fill="#64748B" text-anchor="middle">tanvir@engine: ~/core</text>

    <!-- Code Snippet -->
    <g transform="translate(18, 52)">
      <text x="0" y="16" class="mono" font-size="10.5" fill="#64748B">// Edge Intelligence &amp; Full-Stack</text>
      
      <text x="0" y="36" class="mono" font-size="11">
        <tspan fill="#F43F5E">const</tspan> <tspan fill="#38BDF8">engineer</tspan> = {
      </text>

      <text x="14" y="54" class="mono" font-size="11">
        <tspan fill="#94A3B8">runtimes:</tspan> <tspan fill="#FCD34D">["LiteRT-LM", "llama.rn"]</tspan>,
      </text>

      <text x="14" y="72" class="mono" font-size="11">
        <tspan fill="#94A3B8">ecosystem:</tspan> <tspan fill="#34D399">["React Native", "Next.js"]</tspan>,
      </text>

      <text x="14" y="90" class="mono" font-size="11">
        <tspan fill="#94A3B8">backend:</tspan> <tspan fill="#818CF8">["Node.js", "Express", "Mongo"]</tspan>,
      </text>

      <text x="14" y="108" class="mono" font-size="11">
        <tspan fill="#94A3B8">protocol:</tspan> <tspan fill="#A78BFA">"Model Context Protocol"</tspan>,
      </text>

      <text x="0" y="126" class="mono" font-size="11">
        };
      </text>

      <text x="0" y="146" class="mono" font-size="11">
        <tspan fill="#38BDF8">await</tspan> <tspan fill="#E2E8F0">engineer.</tspan><tspan fill="#60A5FA">buildImpactfulSoftware</tspan><tspan fill="#E2E8F0">();</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom Accent Divider Bar -->
  <line x1="46" y1="288" x2="804" y2="288" stroke="url(#accent-line)" stroke-width="1.8"/>

  <!-- Micro Footer Line inside SVG -->
  <g transform="translate(46, 305)">
    <text x="0" y="0" class="mono" font-size="9.5" fill="#64748B">DHAKA, BANGLADESH</text>
    <text x="379" y="0" class="mono" font-size="9.5" fill="#475569" text-anchor="middle">•  •  •</text>
    <text x="758" y="0" class="mono" font-size="9.5" fill="#38BDF8" text-anchor="end">OPEN TO WORLDWIDE COLLABORATION</text>
  </g>
</svg>
