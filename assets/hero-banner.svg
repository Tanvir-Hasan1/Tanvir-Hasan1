<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>

    <!-- Subtle Glow Accents -->
    <radialGradient id="glow-left" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-right" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    .font-mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style>

  <!-- Container -->
  <rect width="850" height="250" rx="14" fill="url(#bg)" stroke="url(#border-grad)" stroke-width="1.2"/>
  
  <!-- Subtle Ambient Glows -->
  <rect width="850" height="250" rx="14" fill="url(#glow-left)"/>
  <rect width="850" height="250" rx="14" fill="url(#glow-right)"/>

  <!-- Left Content Column (Strictly bounded x=40 to x=470) -->
  <g transform="translate(44, 45)">
    <!-- Role Kicker -->
    <text x="0" y="16" class="font-mono" font-size="12" font-weight="600" fill="#38BDF8" letter-spacing="1.5">FULL-STACK SOFTWARE ENGINEER</text>

    <!-- Name -->
    <text x="0" y="62" class="font-sans" font-size="40" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">Tanvir Hasan</text>

    <!-- Short Human Bio (Max width 420, wraps cleanly) -->
    <text x="0" y="96" class="font-sans" font-size="14" font-weight="400" fill="#94A3B8">
      Building cross-platform mobile apps, on-device AI
    </text>
    <text x="0" y="118" class="font-sans" font-size="14" font-weight="400" fill="#94A3B8">
      systems, and high-performance web platforms.
    </text>

    <!-- Minimal Tech Pills (No CGPA, purely tech focus) -->
    <g transform="translate(0, 138)">
      <rect x="0" y="0" width="102" height="24" rx="12" fill="#1E293B" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
      <text x="51" y="16" class="font-sans" font-size="11" font-weight="500" fill="#E2E8F0" text-anchor="middle">React Native</text>

      <rect x="110" y="0" width="76" height="24" rx="12" fill="#1E293B" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
      <text x="148" y="16" class="font-sans" font-size="11" font-weight="500" fill="#E2E8F0" text-anchor="middle">Next.js</text>

      <rect x="194" y="0" width="94" height="24" rx="12" fill="#1E293B" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
      <text x="241" y="16" class="font-sans" font-size="11" font-weight="500" fill="#E2E8F0" text-anchor="middle">TypeScript</text>

      <rect x="296" y="0" width="106" height="24" rx="12" fill="#1E293B" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
      <text x="349" y="16" class="font-sans" font-size="11" font-weight="500" fill="#38BDF8" text-anchor="middle">On-Device AI</text>
    </g>
  </g>

  <!-- Right Code Window (x=505, width=305, completely separated) -->
  <g transform="translate(505, 36)">
    <!-- Window Body -->
    <rect width="305" height="178" rx="10" fill="#0D131F" stroke="#1E293B" stroke-width="1.2"/>
    
    <!-- Titlebar -->
    <rect width="305" height="28" rx="10" fill="#151D2E"/>
    <path d="M 0 28 L 305 28" stroke="#1E293B" stroke-width="0.8"/>
    
    <!-- Window Dots -->
    <circle cx="16" cy="14" r="4" fill="#EF4444" opacity="0.8"/>
    <circle cx="28" cy="14" r="4" fill="#F59E0B" opacity="0.8"/>
    <circle cx="40" cy="14" r="4" fill="#10B981" opacity="0.8"/>
    <text x="152" y="18" class="font-mono" font-size="10" fill="#64748B" text-anchor="middle">tanvir.ts</text>

    <!-- Code Content -->
    <g transform="translate(18, 46)">
      <text x="0" y="14" class="font-mono" font-size="11">
        <tspan fill="#F43F5E">const</tspan> <tspan fill="#38BDF8">developer</tspan> = {
      </text>

      <text x="14" y="34" class="font-mono" font-size="11">
        <tspan fill="#94A3B8">role:</tspan> <tspan fill="#FCD34D">'Full-Stack Engineer'</tspan>,
      </text>

      <text x="14" y="54" class="font-mono" font-size="11">
        <tspan fill="#94A3B8">mobile:</tspan> <tspan fill="#34D399">['React Native', 'Expo']</tspan>,
      </text>

      <text x="14" y="74" class="font-mono" font-size="11">
        <tspan fill="#94A3B8">aiEdge:</tspan> <tspan fill="#818CF8">['LiteRT-LM', 'llama.rn']</tspan>,
      </text>

      <text x="14" y="94" class="font-mono" font-size="11">
        <tspan fill="#94A3B8">backend:</tspan> <tspan fill="#38BDF8">['Node', 'Express', 'Mongo']</tspan>
      </text>

      <text x="0" y="114" class="font-mono" font-size="11">
        };
      </text>
    </g>
  </g>
</svg>
