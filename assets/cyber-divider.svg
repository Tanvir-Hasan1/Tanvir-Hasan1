<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 24" width="100%" height="24">
  <defs>
    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0"/>
      <stop offset="20%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="1"/>
      <stop offset="80%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Outer Glow Bar -->
  <line x1="80" y1="12" x2="770" y2="12" stroke="url(#divider-grad)" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Subtle ambient halo -->
  <circle cx="425" cy="12" r="10" fill="url(#center-glow)"/>

  <!-- Center Diamond Element -->
  <polygon points="425,7 430,12 425,17 420,12" fill="#38BDF8"/>
  <circle cx="425" cy="12" r="1.5" fill="#FFFFFF"/>

  <!-- Flanking Accent Dots -->
  <circle cx="395" cy="12" r="2" fill="#06B6D4" opacity="0.85"/>
  <circle cx="370" cy="12" r="1.2" fill="#06B6D4" opacity="0.5"/>
  <circle cx="455" cy="12" r="2" fill="#8B5CF6" opacity="0.85"/>
  <circle cx="480" cy="12" r="1.2" fill="#8B5CF6" opacity="0.5"/>
</svg>
